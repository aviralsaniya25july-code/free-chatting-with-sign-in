<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
body.swiping { user-select: none; -webkit-user-select: none; }
#join-screen {
  background: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  width: 320px;
  text-align: center;
}
#join-screen h1 { margin-bottom: 20px; color: #764ba2; }
#join-screen input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}
#join-screen button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #764ba2;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
#chat-screen {
  display: none;
  position: relative;
  width: 400px;
  height: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  flex-direction: column;
  overflow: hidden;
}
#chat-header {
  background: #764ba2;
  color: white;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#header-actions { display: flex; align-items: center; gap: 8px; }
#perm-btn {
  border: none;
  background: rgba(255,255,255,0.2);
  color: white;
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 14px;
  cursor: pointer;
  display: none;
}
#heart-btn {
  display: none;
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  opacity: 0.55;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  background: #f5f5f5;
}
.msg {
  margin-bottom: 10px;
  max-width: 75%;
  position: relative;
  touch-action: pan-y;
}
.msg.mine { margin-left: auto; text-align: right; }
.msg::before {
  content: '↩';
  position: absolute;
  left: -26px;
  top: 50%;
  transform: translateY(-50%);
  color: #764ba2;
  font-size: 18px;
  opacity: var(--swipe, 0);
}
.msg.swipe-ready::before { font-weight: bold; }
.msg .bubble {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 14px;
  background: #e0e0e0;
  text-align: left;
}
.msg.mine .bubble { background: #764ba2; color: white; }
.msg .sender { font-size: 12px; color: #888; margin-bottom: 2px; }
.msg img, .msg video { max-width: 220px; border-radius: 10px; display: block; margin-top: 4px; }
.system-msg { text-align: center; color: #999; font-size: 13px; margin: 8px 0; }

/* Message ke andar quoted reply */
.quoted {
  border-left: 3px solid #764ba2;
  background: rgba(0,0,0,0.08);
  padding: 4px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 12px;
  cursor: pointer;
}
.msg.mine .quoted { border-left-color: white; background: rgba(255,255,255,0.2); }
.quoted .q-name { font-weight: bold; }

/* Highlight jab quoted message pe click ho */
.msg.highlight .bubble { outline: 3px solid #ffd54f; }

/* Typing indicator */
#typing-indicator {
  height: 20px;
  padding: 0 16px;
  font-size: 12px;
  color: #764ba2;
  font-style: italic;
  background: #f5f5f5;
}

/* Reply preview (input ke upar) */
#reply-preview {
  display: none;
  padding: 8px 12px;
  background: #efe6f7;
  border-top: 1px solid #ddd;
  font-size: 13px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#reply-preview .rp-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
#reply-preview button {
  border: none;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  color: #764ba2;
}

#input-area {
  display: flex;
  padding: 12px;
  border-top: 1px solid #ddd;
  gap: 8px;
  align-items: center;
}
#input-area input[type=text] {
  flex: 1;
  padding: 10px;
  border: 2px solid #ddd;
  border-radius: 20px;
  font-size: 14px;
}
#input-area button, #input-area label {
  background: #764ba2;
  color: white;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  flex-shrink: 0;
}
#input-area input[type=file] { display: none; }

/* Overlays (password box + history) */
.overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 10;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: white;
  width: 300px;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
}
.modal-box h3 { color: #764ba2; margin-bottom: 8px; }
.modal-box p { font-size: 12px; color: #777; margin-bottom: 8px; }
.modal-box input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}
#modal-error { color: #d32f2f; font-size: 12px; min-height: 16px; margin: 4px 0; }
.modal-actions { display: flex; gap: 8px; margin-top: 6px; }
.modal-actions button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}
#modal-cancel { background: #e0e0e0; }
#modal-ok { background: #764ba2; color: white; }

.history-box {
  background: white;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.history-head {
  background: #764ba2;
  color: white;
  padding: 14px 16px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-head button {
  border: none;
  background: transparent;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
#history-list { flex: 1; overflow-y: auto; padding: 12px 16px; background: #f5f5f5; }
.hist-item { margin-bottom: 10px; font-size: 14px; }
.hist-item .h-name { font-weight: bold; color: #764ba2; }
.hist-item .h-time { font-size: 11px; color: #999; margin-left: 6px; }
.hist-item img, .hist-item video { max-width: 200px; border-radius: 10px; display: block; margin-top: 4px; }
.hist-empty { text-align: center; color: #999; margin-top: 30px; font-size: 14px; }
</style>
</head>
<body>

<div id="join-screen">
  <h1>Join Chat</h1>
  <input type="text" id="name-input" placeholder="Your Name">
  <input type="text" id="room-input" placeholder="Room Code">
  <button onclick="joinRoom()">Join Room</button>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <span>Room: <span id="room-label"></span></span>
    <span id="header-actions">
      <button id="perm-btn">📌 Make permanent</button>
      <button id="heart-btn" title="">❤️</button>
    </span>
  </div>
  <div id="messages"></div>
  <div id="typing-indicator"></div>
  <div id="reply-preview">
    <div class="rp-text" id="rp-text"></div>
    <button onclick="cancelReply()">✖</button>
  </div>
  <div id="input-area">
    <label for="media-input">📎</label>
    <input type="file" id="media-input" accept="image/*,video/*">
    <input type="text" id="msg-input" placeholder="Type a message">
    <button onclick="sendMessage()">➤</button>
  </div>

  <!-- Password box -->
  <div id="modal" class="overlay">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-note"></p>
      <input type="password" id="modal-pass" placeholder="Password">
      <input type="password" id="modal-pass2" placeholder="Password dobara likho">
      <div id="modal-error"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Chat history -->
  <div id="history-panel" class="overlay">
    <div class="history-box">
      <div class="history-head">
        <span>❤️ Chat history</span>
        <button onclick="closeHistory()">✖</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = "";
let replyingTo = null;      // { id, name, preview }
let typingTimeout = null;
let isTyping = false;
const typingUsers = new Set();

function joinRoom() {
  const name = document.getElementById('name-input').value.trim();
  const room = document.getElementById('room-input').value.trim();
  if (!name || !room) return alert("Please enter name and room code");
  myName = name;
  socket.emit('join-room', { name, roomCode: room });
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('room-label').innerText = room;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
