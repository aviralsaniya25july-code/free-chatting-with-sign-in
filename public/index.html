<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
#join-screen {
  background: white;
  padding: 40px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  width: 320px;
  text-align: center;
}
#join-screen h1 { margin-bottom: 20px; color: #764ba2; }
#join-screen input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}
#join-screen button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #764ba2;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
#chat-screen {
  display: none;
  width: 400px;
  height: 600px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  flex-direction: column;
  overflow: hidden;
}
#chat-header {
  background: #764ba2;
  color: white;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
}
#messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  background: #f5f5f5;
}
.msg { margin-bottom: 10px; max-width: 75%; position: relative; }
.msg.mine { margin-left: auto; text-align: right; }
.msg .bubble {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 14px;
  background: #e0e0e0;
  text-align: left;
}
.msg.mine .bubble { background: #764ba2; color: white; }
.msg .sender { font-size: 12px; color: #888; margin-bottom: 2px; }
.msg img, .msg video { max-width: 220px; border-radius: 10px; display: block; margin-top: 4px; }
.system-msg { text-align: center; color: #999; font-size: 13px; margin: 8px 0; }

/* Reply button (har message ke saath) */
.reply-btn {
  border: none;
  background: transparent;
  color: #764ba2;
  font-size: 12px;
  cursor: pointer;
  margin-top: 2px;
  opacity: 0.6;
}
.reply-btn:hover { opacity: 1; }

/* Message ke andar quoted reply */
.quoted {
  border-left: 3px solid #764ba2;
  background: rgba(0,0,0,0.08);
  padding: 4px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  font-size: 12px;
  cursor: pointer;
}
.msg.mine .quoted { border-left-color: white; background: rgba(255,255,255,0.2); }
.quoted .q-name { font-weight: bold; }

/* Highlight jab quoted message pe click ho */
.msg.highlight .bubble { outline: 3px solid #ffd54f; }

/* Typing indicator */
#typing-indicator {
  height: 20px;
  padding: 0 16px;
  font-size: 12px;
  color: #764ba2;
  font-style: italic;
  background: #f5f5f5;
}

/* Reply preview (input ke upar) */
#reply-preview {
  display: none;
  padding: 8px 12px;
  background: #efe6f7;
  border-top: 1px solid #ddd;
  font-size: 13px;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#reply-preview .rp-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
#reply-preview button {
  border: none;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  color: #764ba2;
}

#input-area {
  display: flex;
  padding: 12px;
  border-top: 1px solid #ddd;
  gap: 8px;
  align-items: center;
}
#input-area input[type=text] {
  flex: 1;
  padding: 10px;
  border: 2px solid #ddd;
  border-radius: 20px;
  font-size: 14px;
}
#input-area button, #input-area label {
  background: #764ba2;
  color: white;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  flex-shrink: 0;
}
#input-area input[type=file] { display: none; }
</style>
</head>
<body>

<div id="join-screen">
  <h1>Join Chat</h1>
  <input type="text" id="name-input" placeholder="Your Name">
  <input type="text" id="room-input" placeholder="Room Code">
  <button onclick="joinRoom()">Join Room</button>
</div>

<div id="chat-screen">
  <div id="chat-header">Room: <span id="room-label"></span></div>
  <div id="messages"></div>
  <div id="typing-indicator"></div>
  <div id="reply-preview">
    <div class="rp-text" id="rp-text"></div>
    <button onclick="cancelReply()">✖</button>
  </div>
  <div id="input-area">
    <label for="media-input">📎</label>
    <input type="file" id="media-input" accept="image/*,video/*">
    <input type="text" id="msg-input" placeholder="Type a message">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = "";
let replyingTo = null;      // { id, name, preview }
let typingTimeout = null;
let isTyping = false;
const typingUsers = new Set();

function joinRoom() {
  const name = document.getElementById('name-input').value.trim();
  const room = document.getElementById('room-input').value.trim();
  if (!name || !room) return alert("Please enter name and room code");
  myName = name;
  socket.emit('join-room', { name, roomCode: room });
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('room-label').innerText = room;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('chat-message', { message: text, replyTo: replyingTo });
  input.value = '';
  cancelReply();
  stopTyping();
}

/* ---------- Typing indicator ---------- */
const msgInput = document.getElementById('msg-input');

msgInput.addEventListener('input', () => {
  if (!isTyping) {
    isTyping = true;
    socket.emit('typing');
  }
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(stopTyping, 1500);
});

function stopTyping() {
  clearTimeout(typingTimeout);
  if (isTyping) {
    isTyping = false;
    socket.emit('stop-typing');
  }
}

socket.on('typing', ({ name }) => {
  typingUsers.add(name);
  updateTypingText();
});

socket.on('stop-typing', ({ name }) => {
  typingUsers.delete(name);
  updateTypingText();
});

function updateTypingText() {
  const el = document.getElementById('typing-indicator');
  const names = Array.from(typingUsers);
  if (names.length === 0) el.innerText = '';
  else if (names.length === 1) el.innerText = names[0] + ' is typing...';
  else el.innerText = names.join(', ') + ' are typing...';
}

/* ---------- Reply ---------- */
function startReply(id, name, preview) {
  replyingTo = { id, name, preview };
  document.getElementById('rp-text').innerText = 'Replying to ' + name + ': ' + preview;
  document.getElementById('reply-preview').style.display = 'flex';
  msgInput.focus();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-preview').style.display = 'none';
}

function scrollToMessage(id) {
  const el = document.querySelector('[data-id="' + id + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}

function buildQuotedHtml(replyTo) {
  if (!replyTo) return '';
  return '<div class="quoted" onclick="scrollToMessage(\'' + replyTo.id + '\')">' +
    '<div class="q-name">' + escapeHtml(replyTo.name) + '</div>' +
    '<div>' + escapeHtml(replyTo.preview) + '</div></div>';
}

/* ---------- Media upload ---------- */
msgInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

document.getElementById('media-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const result = await res.json();
    if (result.url) {
      socket.emit('media-message', { url: result.url, type: result.type, replyTo: replyingTo });
      cancelReply();
    }
  } catch (err) {
    alert('Upload failed, please try again');
  }
  e.target.value = '';
});

/* ---------- Incoming messages ---------- */
socket.on('chat-message', ({ id, name, message, replyTo }) => {
  typingUsers.delete(name);
  updateTypingText();
  addTextMessage(id, name, message, name === myName, replyTo);
});

socket.on('media-message', ({ id, name, url, type, replyTo }) => {
  typingUsers.delete(name);
  updateTypingText();
  addMediaMessage(id, name, url, type, name === myName, replyTo);
});

socket.on('system-message', (text) => {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.innerText = text;
  document.getElementById('messages').appendChild(div);
  scrollDown();
});

function addTextMessage(id, name, text, mine, replyTo) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' mine' : '');
  wrap.setAttribute('data-id', id);
  wrap.innerHTML =
    '<div class="sender">' + (mine ? '' : escapeHtml(name)) + '</div>' +
    '<div class="bubble">' + buildQuotedHtml(replyTo) + escapeHtml(text) + '</div>' +
    '<br><button class="reply-btn">↩ Reply</button>';
  wrap.querySelector('.reply-btn').addEventListener('click', () => {
    startReply(id, name, text.length > 50 ? text.slice(0, 50) + '...' : text);
  });
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

function addMediaMessage(id, name, url, type, mine, replyTo) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' mine' : '');
  wrap.setAttribute('data-id', id);
  let mediaTag = '';
  let label = '📎 File';
  if (type.startsWith('image/')) {
    mediaTag = '<img src="' + url + '">';
    label = '📷 Photo';
  } else if (type.startsWith('video/')) {
    mediaTag = '<video src="' + url + '" controls></video>';
    label = '🎥 Video';
  }
  wrap.innerHTML =
    '<div class="sender">' + (mine ? '' : escapeHtml(name)) + '</div>' +
    '<div class="bubble">' + buildQuotedHtml(replyTo) + mediaTag +
    '<br><a href="' + url + '" download>Download</a></div>' +
    '<br><button class="reply-btn">↩ Reply</button>';
  wrap.querySelector('.reply-btn').addEventListener('click', () => {
    startReply(id, name, label);
  });
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

function scrollDown() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}
</script>
</body>
</html>
