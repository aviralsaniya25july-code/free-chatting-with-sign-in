<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,sans-serif;background:#111;color:#eee}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:#2d7ff9;color:#fff;font-size:15px}
input{padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:16px}
#join-screen{height:100%;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:20px}
#join-screen input{width:100%;max-width:320px}
#chat-screen,#history-panel{display:none;flex-direction:column;height:100%;height:100dvh}
#history-panel{position:fixed;inset:0;background:#111;z-index:20}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;background:#1c1c1c}
.list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg,.hist-item{max-width:80%;padding:8px 10px;border-radius:10px;background:#2a2a2a;align-self:flex-start;word-break:break-word;touch-action:pan-y}
.msg.mine,.hist-item.mine{align-self:flex-end;background:#1f4fa3}
.msg.highlight,.hist-item.highlight{outline:2px solid #ffd54a}
.msg.swipe-ready,.hist-item.swipe-ready{outline:2px solid #2d7ff9}
.name{font-size:12px;opacity:.7}
.ts{font-size:10px;opacity:.5;margin-left:6px}
.quote{border-left:3px solid #2d7ff9;padding:2px 8px;margin-bottom:6px;background:#0003;border-radius:4px;cursor:pointer}
.quote b{display:block;font-size:12px}
.quote span{font-size:13px;opacity:.8}
.msg img,.msg video,.hist-item img,.hist-item video{max-width:100%;border-radius:8px;display:block}
.msg a,.hist-item a{color:#8ab4ff;font-size:13px}
.system-msg,.hist-empty{align-self:center;font-size:12px;opacity:.6}
#typing-indicator{height:18px;padding:0 12px;font-size:12px;opacity:.7}
.reply-preview{display:none;align-items:center;justify-content:space-between;padding:6px 10px;background:#222;font-size:13px}
.reply-preview button{background:none;padding:2px 8px}
.inputbar{display:flex;gap:6px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#1c1c1c}
.inputbar input[type=text]{flex:1;min-width:0}
.attach{display:flex;align-items:center;padding:0 10px;background:#333;border-radius:8px;cursor:pointer}
.attach input{display:none}
#modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:30;padding:20px}
.box{background:#222;padding:18px;border-radius:12px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#modal-note{font-size:13px;opacity:.75}
#modal-error{color:#ff6b6b;font-size:13px;min-height:16px}
.row{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div id="join-screen">
  <h2>Chat Room</h2>
  <input id="name-input" placeholder="Your name">
  <input id="room-input" placeholder="Room code">
  <button onclick="joinRoom()">Join</button>
</div>

<div id="chat-screen">
  <div class="topbar">
    <span>Room: <b id="room-label"></b></span>
    <span>
      <button id="perm-btn" style="display:none">Make permanent</button>
      <button id="heart-btn" style="display:none;background:none;font-size:20px">❤️</button>
    </span>
  </div>
  <div id="messages" class="list"></div>
  <div id="typing-indicator"></div>
  <div id="reply-preview" class="reply-preview">
    <span id="rp-text"></span><button onclick="cancelReply()">✕</button>
  </div>
  <div class="inputbar">
    <label class="attach">📎<input type="file" id="media-input"></label>
    <input type="text" id="msg-input" placeholder="Type a message">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div id="modal">
  <div class="box">
    <h3 id="modal-title"></h3>
    <div id="modal-note"></div>
    <input type="password" id="modal-pass" placeholder="Password">
    <input type="password" id="modal-pass2" placeholder="Confirm password">
    <div id="modal-error"></div>
    <div class="row">
      <button id="modal-cancel" style="background:#444">Cancel</button>
      <button id="modal-ok">OK</button>
    </div>
  </div>
</div>

<div id="history-panel">
  <div class="topbar">
    <b>🔒 Secret chat</b>
    <button onclick="closeHistory()">Close</button>
  </div>
  <div id="history-list" class="list"></div>
  <div id="secret-reply-preview" class="reply-preview">
    <span id="secret-rp-text"></span><button onclick="cancelSecretReply()">✕</button>
  </div>
  <div class="inputbar">
    <label class="attach">📎<input type="file" id="secret-media-input"></label>
    <input type="text" id="secret-msg-input" placeholder="Secret message">
    <button onclick="sendSecretMessage()">Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = "";
let replyingTo = null;
let secretReplyingTo = null;
let typingTimeout = null;
let isTyping = false;
const typingUsers = new Set();

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function scrollDown() {
  const b = document.getElementById('messages');
  b.scrollTop = b.scrollHeight;
}

function joinRoom() {
  const name = document.getElementById('name-input').value.trim();
  const room = document.getElementById('room-input').value.trim();
  if (!name || !room) return alert("Please enter name and room code");
  myName = name;
  socket.emit('join-room', { name, roomCode: room });
  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
  document.getElementById('room-label').innerText = room;
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  socket.emit('chat-message', { message: text, replyTo: replyingTo });
  input.value = '';
  cancelReply();
  stopTyping();
}

/* ---------- Typing indicator ---------- */
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('input', () => {
  if (!isTyping) { isTyping = true; socket.emit('typing'); }
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(stopTyping, 1500);
});
msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
function stopTyping() {
  clearTimeout(typingTimeout);
  if (isTyping) { isTyping = false; socket.emit('stop-typing'); }
}
socket.on('typing', ({ name }) => { typingUsers.add(name); updateTypingText(); });
socket.on('stop-typing', ({ name }) => { typingUsers.delete(name); updateTypingText(); });
function updateTypingText() {
  const el = document.getElementById('typing-indicator');
  const names = Array.from(typingUsers);
  if (names.length === 0) el.innerText = '';
  else if (names.length === 1) el.innerText = names[0] + ' is typing...';
  else el.innerText = names.join(', ') + ' are typing...';
}

/* ---------- Reply (normal chat) ---------- */
function startReply(id, name, preview) {
  replyingTo = { id, name, preview };
  document.getElementById('rp-text').innerText = 'Replying to ' + name + ': ' + preview;
  document.getElementById('reply-preview').style.display = 'flex';
  msgInput.focus();
}
function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-preview').style.display = 'none';
}
function scrollToMessage(id) {
  const el = document.querySelector('[data-id="' + id + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}
function buildQuotedHtml(replyTo) {
  if (!replyTo) return '';
  return '<div class="quote" onclick="scrollToMessage(\'' + escapeHtml(replyTo.id) + '\')">' +
    '<b>' + escapeHtml(replyTo.name) + '</b>' +
    '<span>' + escapeHtml(replyTo.preview) + '</span></div>';
}

/* ---------- Swipe to reply (normal + secret) ---------- */
function attachSwipe(container, onTrigger) {
  const SWIPE_TRIGGER = 40, SWIPE_MAX = 56;
  let sw = null;
  container.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.msg, .hist-item');
    if (!el || !el._reply) return;
    if (e.target.closest('a, video')) return;
    sw = { el, id: e.pointerId, startX: e.clientX, startY: e.clientY, dx: 0, active: false };
  });
  window.addEventListener('pointermove', (e) => {
    if (!sw || sw.el.parentNode !== container || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.startX;
    const dy = e.clientY - sw.startY;
    if (!sw.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
      if (dx > 10 && dx > Math.abs(dy)) { sw.active = true; }
      else return;
    }
    const move = Math.max(0, Math.min(dx, SWIPE_MAX));
    sw.dx = dx;
    sw.el.style.transition = 'none';
    sw.el.style.transform = 'translateX(' + move + 'px)';
    sw.el.classList.toggle('swipe-ready', dx >= SWIPE_TRIGGER);
  });
  function endSwipe(e) {
    if (!sw || sw.el.parentNode !== container || e.pointerId !== sw.id) return;
    const s = sw; sw = null;
    s.el.style.transition = 'transform 0.2s';
    s.el.style.transform = '';
    s.el.classList.remove('swipe-ready');
    if (s.active && s.dx >= SWIPE_TRIGGER) onTrigger(s.el._reply);
  }
  window.addEventListener('pointerup', endSwipe);
  window.addEventListener('pointercancel', endSwipe);
}
attachSwipe(document.getElementById('messages'), (r) => startReply(r.id, r.name, r.preview));
attachSwipe(document.getElementById('history-list'), (r) => startSecretReply(r));

/* ---------- Normal media upload ---------- */
document.getElementById('media-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const result = await res.json();
    if (result.url) {
      socket.emit('media-message', { url: result.url, type: result.type, replyTo: replyingTo });
      cancelReply();
    }
  } catch (err) { alert('Upload failed, please try again'); }
  e.target.value = '';
});

socket.on('chat-message', ({ id, name, message, replyTo }) => {
  typingUsers.delete(name); updateTypingText();
  addTextMessage(id, name, message, name === myName, replyTo);
});
socket.on('media-message', ({ id, name, url, type, replyTo }) => {
  typingUsers.delete(name); updateTypingText();
  addMediaMessage(id, name, url, type, name === myName, replyTo);
});
socket.on('system-message', (text) => {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.innerText = text;
  document.getElementById('messages').appendChild(div);
  scrollDown();
});

function addTextMessage(id, name, text, mine, replyTo) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' mine' : '');
  wrap.setAttribute('data-id', id);
  wrap._reply = { id, name, preview: text.length > 50 ? text.slice(0, 50) + '...' : text };
  wrap.innerHTML =
    '<div class="name">' + (mine ? '' : escapeHtml(name)) + '</div>' +
    '<div>' + buildQuotedHtml(replyTo) + escapeHtml(text) + '</div>';
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}
function mediaHtml(url, type) {
  type = type || '';
  let tag = '', label = '📎 File';
  if (type.startsWith('image/')) { tag = '<img src="' + escapeHtml(url) + '">'; label = '📷 Photo'; }
  else if (type.startsWith('video/')) { tag = '<video controls src="' + escapeHtml(url) + '"></video>'; label = '🎥 Video'; }
  tag += '<a href="' + escapeHtml(url) + '" target="_blank" download>Download</a>';
  return { tag, label };
}
function addMediaMessage(id, name, url, type, mine, replyTo) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (mine ? ' mine' : '');
  wrap.setAttribute('data-id', id);
  const m = mediaHtml(url, type);
  wrap._reply = { id, name, preview: m.label };
  wrap.innerHTML =
    '<div class="name">' + (mine ? '' : escapeHtml(name)) + '</div>' +
    '<div>' + buildQuotedHtml(replyTo) + m.tag + '</div>';
  document.getElementById('messages').appendChild(wrap);
  scrollDown();
}

/* ---------- Permanent room + password modal ---------- */
const permBtn = document.getElementById('perm-btn');
const heartBtn = document.getElementById('heart-btn');
const modal = document.getElementById('modal');
const modalPass = document.getElementById('modal-pass');
const modalPass2 = document.getElementById('modal-pass2');
let modalMode = null;

socket.on('room-info', ({ permanent }) => {
  permBtn.style.display = permanent ? 'none' : 'inline-block';
  heartBtn.style.display = permanent ? 'inline-block' : 'none';
  if (permanent && modalMode === 'make' && modal.style.display === 'flex') closeModal();
});

function openModal(mode) {
  modalMode = mode;
  modalPass.value = ''; modalPass2.value = '';
  setModalError('');
  if (mode === 'make') {
    document.getElementById('modal-title').innerText = 'Make room permanent';
    document.getElementById('modal-note').innerText =
      'Ek password set karo. Is room ki secret chat hamesha save rahegi. Password baad mein badal nahi sakte, yaad rakhna.';
    modalPass2.style.display = 'block';
  } else {
    document.getElementById('modal-title').innerText = 'Enter password';
    document.getElementById('modal-note').innerText = '';
    modalPass2.style.display = 'none';
  }
  modal.style.display = 'flex';
  modalPass.focus();
}
function closeModal() {
  modal.style.display = 'none';
  modalMode = null;
  modalPass.value = ''; modalPass2.value = '';
}
function setModalError(text) { document.getElementById('modal-error').innerText = text; }

function submitModal() {
  const pass = modalPass.value;
  if (modalMode === 'make') {
    if (pass.length < 4) return setModalError('Password kam se kam 4 characters ka rakho');
    if (pass !== modalPass2.value) return setModalError('Dono password match nahi hue');
    socket.emit('make-permanent', { password: pass });
  } else if (modalMode === 'unlock') {
    if (!pass) return setModalError('Password likho');
    socket.emit('unlock-history', { password: pass });
  }
}
permBtn.addEventListener('click', () => openModal('make'));
document.getElementById('modal-ok').addEventListener('click', submitModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
[modalPass, modalPass2].forEach((el) => {
  el.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitModal(); });
});
socket.on('permanent-error', (text) => setModalError(text));
socket.on('history-error', (text) => setModalError(text));

let holdTimer = null;
heartBtn.addEventListener('pointerdown', () => {
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { holdTimer = null; openModal('unlock'); }, 700);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => {
  heartBtn.addEventListener(ev, () => clearTimeout(holdTimer));
});
heartBtn.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- Secret chat (alag chat, apna typing box) ---------- */
const historyPanel = document.getElementById('history-panel');
const historyList = document.getElementById('history-list');
const secretMsgInput = document.getElementById('secret-msg-input');

socket.on('history', (items) => {
  closeModal();
  historyList.innerHTML = '';
  if (!items || !items.length) {
    const empty = document.createElement('div');
    empty.className = 'hist-empty';
    empty.innerText = 'Abhi tak koi secret message nahi hai, pehla bhejo';
    historyList.appendChild(empty);
  } else {
    items.forEach(addSecretItem);
  }
  historyPanel.style.display = 'flex';
  historyList.scrollTop = historyList.scrollHeight;
  secretMsgInput.focus();
});

socket.on('secret-message', (m) => {
  if (historyPanel.style.display !== 'flex') return;
  const empty = historyList.querySelector('.hist-empty');
  if (empty) empty.remove();
  addSecretItem(m);
  historyList.scrollTop = historyList.scrollHeight;
});

function addSecretItem(m) {
  const row = document.createElement('div');
  row.className = 'hist-item' + (m.name === myName ? ' mine' : '');
  row.setAttribute('data-id', m.id);

  let label = m.message || '';
  let body = '';
  if (m.kind === 'media' && m.url) {
    const x = mediaHtml(m.url, m.type);
    body = x.tag; label = x.label;
  } else {
    body = escapeHtml(m.message || '');
  }
  row.innerHTML =
    '<div class="name">' + escapeHtml(m.name || '') +
    '<span class="ts">' + (m.ts ? new Date(m.ts).toLocaleString() : '') + '</span></div>' +
    '<div>' + buildQuotedHtml(m.replyTo) + body + '</div>';
  row._reply = { id: m.id, name: m.name, preview: label.length > 50 ? label.slice(0, 50) + '...' : label };
  historyList.appendChild(row);
}

function startSecretReply(r) {
  secretReplyingTo = r;
  document.getElementById('secret-rp-text').innerText = 'Replying to ' + r.name + ': ' + r.preview;
  document.getElementById('secret-reply-preview').style.display = 'flex';
  secretMsgInput.focus();
}
function cancelSecretReply() {
  secretReplyingTo = null;
  document.getElementById('secret-reply-preview').style.display = 'none';
}

function sendSecretMessage() {
  const text = secretMsgInput.value.trim();
  if (!text) return;
  socket.emit('secret-message', { message: text, replyTo: secretReplyingTo });
  secretMsgInput.value = '';
  cancelSecretReply();
}
secretMsgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendSecretMessage(); });

document.getElementById('secret-media-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const result = await res.json();
    if (result.url) {
      socket.emit('secret-media-message', { url: result.url, type: result.type, replyTo: secretReplyingTo });
      cancelSecretReply();
    }
  } catch (err) { alert('Upload failed, please try again'); }
  e.target.value = '';
});

function closeHistory() {
  historyPanel.style.display = 'none';
  historyList.innerHTML = '';
  cancelSecretReply();
}
</script>
</body>
</html>
